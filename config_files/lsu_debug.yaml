LSUDebugComponent: &lsuDebug
  class: LSUDebugComponent
  fetch: *ENGINE
  lsu:
    class: LoadStoreUnit
    cache:
      class: SimpleMemory
    sendTo: *lsuDebug
    storeBufSize: 16
    loadBypassingEnabled: true
    loadForwardingEnabled: true
  storeTableSize: 64
  loadTableSize: 96
  loadBypassingEnabled: true
  loadForwardingEnabled: true
